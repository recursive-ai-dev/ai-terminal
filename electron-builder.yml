# ==============================================================
# electron-builder configuration
# Targets: AppImage (Linux), NSIS (Windows), DMG (macOS)
# Run: npx electron-builder --linux appimage
#      npx electron-builder --win nsis
#      npx electron-builder --mac dmg
# ==============================================================

appId: "com.aiterminal.desktop"
productName: "AI Terminal"
copyright: "Copyright © 2026 AI Terminal"

# ── Directories ──
directories:
  buildResources: assets
  output: release

# ── Files to include in the app package ──
files:
  - dist/**/*          # Vite production build (renderer)
  - electron-dist/**/* # Compiled main process + preload
  - assets/**/*        # Icons, resources
  - "!src/**/*"
  - "!electron/**/*"   # Source only — compiled output used
  - "!*.ts"
  - "!*.md"

# ── Extra resources (copied outside ASAR) ──
extraResources:
  - from: assets
    to: assets
    filter:
      - "**/*.png"
      - "**/*.ico"
      - "**/*.icns"

# ══════════════════════════════════════════════════════════════
# LINUX — AppImage (primary target)
# ══════════════════════════════════════════════════════════════
linux:
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
  icon: assets/icon.png
  category: "Utility"
  description: "Linux-native AI terminal with an approval-first copilot and neural computing lab"
  desktop:
    entry:
      Name: "AI Terminal"
      Comment: "Linux-native terminal with an approval-first AI copilot"
      Keywords: "terminal;ai;linux;shell;neural;"
      StartupWMClass: "ai-terminal"
  artifactName: "ai-terminal-${version}-${arch}.AppImage"

# ── AppImage-specific ──
appImage:
  artifactName: "ai-terminal-${version}-${arch}.AppImage"

# ══════════════════════════════════════════════════════════════
# WINDOWS — NSIS installer
# ══════════════════════════════════════════════════════════════
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/icon.ico
  artifactName: "ai-terminal-${version}-setup.exe"

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "AI Terminal"
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico

# ══════════════════════════════════════════════════════════════
# MACOS — DMG
# ══════════════════════════════════════════════════════════════
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: assets/icon.icns
  category: "public.app-category.developer-tools"
  hardenedRuntime: true
  entitlements: assets/entitlements.mac.plist
  entitlementsInherit: assets/entitlements.mac.plist
  artifactName: "ai-terminal-${version}-${arch}.dmg"

dmg:
  window:
    width: 540
    height: 380
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# ══════════════════════════════════════════════════════════════
# AUTO-UPDATER — GitHub Releases
# Replace owner/repo with your GitHub repository
# ══════════════════════════════════════════════════════════════
publish:
  provider: github
  owner: recursive-ai-dev
  repo: ai-terminal
  releaseType: release
  publishAutoUpdate: true

# ══════════════════════════════════════════════════════════════
# ASAR options
# ══════════════════════════════════════════════════════════════
asar: true
asarUnpack:
  - node_modules/electron-store/**
  - node_modules/electron-updater/**
  - node_modules/node-pty/**
