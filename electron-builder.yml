# ==============================================================
# electron-builder configuration
# Primary target: Linux AppImage. Windows (NSIS) and macOS (DMG)
# remain configured for cross-platform packaging.
#
#   npm run dist:linux          # AppImage for the host architecture
#   npm run dist:linux -- --arm64
#   npm run dist:win / dist:mac
#
# Only runtime dependencies from package.json "dependencies" /
# "optionalDependencies" are packed; the renderer is pre-bundled by
# Vite into dist/, and the main process by esbuild into electron-dist/.
# ==============================================================

appId: "com.aiterminal.desktop"
productName: "AI Terminal"
copyright: "Copyright © 2026 AI Terminal"

directories:
  buildResources: assets
  output: release

files:
  - package.json
  - dist/**/*
  - electron-dist/**/*
  - assets/icon.png
  - assets/tray-icon.png

# node-pty ships a native addon and a spawn helper that must be real
# files on disk (not inside app.asar) to be loaded and executed.
asar: true
asarUnpack:
  - "node_modules/node-pty/**"

# Rebuild native dependencies (node-pty) against Electron's ABI.
npmRebuild: true

# ══════════════════════════════════════════════════════════════
# LINUX — AppImage (primary target)
# ══════════════════════════════════════════════════════════════
linux:
  target:
    - target: AppImage
  executableName: ai-terminal
  # .desktop file name and StartupWMClass follow package.json "desktopName",
  # which Electron also uses as the window's app_id / WM_CLASS.
  syncDesktopName: true
  icon: assets/icon.png
  category: "System;TerminalEmulator"
  synopsis: "Linux terminal with an approval-first AI copilot"
  description: "Linux-native AI terminal with an approval-first copilot and neural computing lab"
  desktop:
    entry:
      Name: "AI Terminal"
      Comment: "Linux-native terminal with an approval-first AI copilot"
      Keywords: "terminal;shell;console;command;ai;"
  artifactName: "ai-terminal-${version}-${arch}.${ext}"

# ══════════════════════════════════════════════════════════════
# WINDOWS — NSIS installer
# ══════════════════════════════════════════════════════════════
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/icon.ico
  artifactName: "ai-terminal-${version}-setup.${ext}"

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "AI Terminal"
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico

# ══════════════════════════════════════════════════════════════
# MACOS — DMG (electron-builder converts the 512px PNG to .icns)
# ══════════════════════════════════════════════════════════════
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: assets/icon.png
  category: "public.app-category.developer-tools"
  hardenedRuntime: true
  entitlements: assets/entitlements.mac.plist
  entitlementsInherit: assets/entitlements.mac.plist
  artifactName: "ai-terminal-${version}-${arch}.${ext}"

dmg:
  window:
    width: 540
    height: 380
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# ══════════════════════════════════════════════════════════════
# AUTO-UPDATER — GitHub Releases
# ══════════════════════════════════════════════════════════════
publish:
  provider: github
  owner: recursive-ai-dev
  repo: ai-terminal
  releaseType: release
